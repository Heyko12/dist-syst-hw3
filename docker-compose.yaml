version: '3'
services:
  postgres1:
    image: postgres:15
    environment: 
      POSTGRES_PASSWORD: postgres
    mem_limit: 1024m
    cpus: 1.0
  postgres2:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
    mem_limit: 1024m
    cpus: 1.0
  postgres3:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
    mem_limit: 1024m
    cpus: 1.0
  postgres4:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
    mem_limit: 1024m
    cpus: 1.0
  postgres5:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
    mem_limit: 1024m
    cpus: 1.0
  postgres6:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
    mem_limit: 1024m
    cpus: 1.0
  postgres7:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
    mem_limit: 1024m
    cpus: 1.0
  postgres8:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
    mem_limit: 1024m
    cpus: 1.0

  app:
    image: antipova-simpleservice:latest
    ports: ["8080:8080"]
    environment:
      APP_SHARD_COUNT: "1"
      SHARD1_URL: jdbc:postgresql://postgres1:5432/postgres
      SHARD2_URL: jdbc:postgresql://postgres2:5432/postgres
      SHARD3_URL: jdbc:postgresql://postgres3:5432/postgres
      SHARD4_URL: jdbc:postgresql://postgres4:5432/postgres
      SHARD5_URL: jdbc:postgresql://postgres5:5432/postgres
      SHARD6_URL: jdbc:postgresql://postgres6:5432/postgres
      SHARD7_URL: jdbc:postgresql://postgres7:5432/postgres
      SHARD8_URL: jdbc:postgresql://postgres8:5432/postgres

      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      SERVER_TOMCAT_MAX_THREADS: "40"
      SERVER_TOMCAT_MIN_SPARE_THREADS: "20"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "40"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "20"

      SPRING_MAIN_BANNER_MODE: "off"
      LOGGING_LEVEL_ROOT: "WARN"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: "WARN"
